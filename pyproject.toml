[project]
name = "opencontext-arcgis-hub"
version = "1.2.3"
description = "Shared ArcGIS Online / Hub plugin base for OpenContext MCP deployments: discovery, schema, attribute and spatial queries, polygon analytics, upstream resilience and structured output. Deployments subclass it with their region's specifics."
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The plugin interfaces (core.interfaces). Deliberately unpinned here:
    # each deployment pins its own opencontext-core tag, and this package
    # must not drag a second copy in at a different version.
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "pyclipper>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "opencontext-core @ git+https://github.com/codeforanchorage/opencontext-core@v1.4.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.0.0",
    # tests validate tool results against the declared outputSchema
    "jsonschema>=4.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/codeforanchorage/opencontext-arcgis-hub"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arcgis_hub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

# Same rule set the deployments were written against; stated so a newer
# ruff with broader defaults does not turn into a restyle.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
